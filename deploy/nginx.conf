# Static hosting for Lanelet Inspector.
#   sudo cp deploy/nginx.conf /etc/nginx/conf.d/lanelet.conf
#   sudo rsync -a dist/ /var/www/lanelet/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name  maps.example.edu;          # <-- your hostname
    root         /var/www/lanelet;           # <-- where you copied dist/
    index        index.html;

    # .pcd and .osm are not in nginx's default mime.types
    types {
        text/html                             html;
        text/css                              css;
        text/javascript                       js;
        application/xml                       osm xml;
        application/octet-stream              pcd;
        image/svg+xml                         svg;
    }
    default_type application/octet-stream;

    # npm run build writes .gz siblings; serve them instead of compressing per request
    gzip_static on;
    gzip on;
    gzip_types text/css text/javascript application/xml application/octet-stream;
    gzip_min_length 1024;

    # Point clouds are big and immutable — cache them hard.
    location /data/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }
    # config.js and index.html must never be cached, or edits won't show up.
    location = /config.js { add_header Cache-Control "no-cache"; }
    location = /         { add_header Cache-Control "no-cache"; try_files /index.html =404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
